---
# tasks file for haproxy

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Remove the Zenetys repository
  ansible.builtin.yum_repository:
    name: zenetys-latest
    state: absent

- name: Add the HAProxy Technologies repository
  ansible.builtin.yum_repository:
    name: haproxy-{{ haproxy_branch }}
    description: "HAProxy {{ haproxy_branch }} performance packages by HAProxy Technologies"
    baseurl: "https://cdn.haproxy.com/download/haproxy/performance/rhel/{{ haproxy_branch }}/el$releasever/$basearch"
    gpgcheck: true
    gpgkey: https://cdn.haproxy.com/download/haproxy/HAPROXY-key-community.asc

- name: Gather package facts
  ansible.builtin.package_facts:

# haproxy_package provides "haproxy"; remove only a package of that name.
- name: Uninstall legacy haproxy
  ansible.builtin.package:
    name: haproxy
    state: absent
  when: "'haproxy' in ansible_facts.packages"
  notify:
    - Restart haproxy

# The Zenetys builds (haproxy30z+quic, ...) install the same files as
# haproxy_package but declare no conflict with it, so installing it next to
# them fails. dnf swap replaces them in one transaction. The swap also resets
# /etc/sysconfig/haproxy to the package default, which is what the
# haproxy.service of haproxy_package expects: it loads /etc/haproxy/conf.d
# itself.
#
# The swap runs without package scriptlets. The Zenetys package's removal
# script runs `systemctl disable --now haproxy`, which stops HAProxy for the
# whole transaction (SYSTEMD_OFFLINE does not prevent that on EL9). Without
# it, the old process keeps serving until the handler restarts it into the
# new binary, once, after the check below. The new package's scripts only
# create the haproxy user and enable the unit, which this role does itself.
- name: Swap the Zenetys HAProxy builds for {{ haproxy_package }}
  ansible.builtin.command:
    cmd: >-
      dnf --assumeyes --setopt=tsflags=noscripts
      swap {{ item | quote }} {{ haproxy_package | quote }}
  loop: "{{ ansible_facts.packages | select('match', '^haproxy[0-9]+z') | list }}"
  changed_when: true
  notify:
    - Restart haproxy

- name: Install haproxy
  ansible.builtin.package:
    name: "{{ haproxy_package }}"
    state: present
  # In check mode the repository above is not added yet
  ignore_errors: "{{ ansible_check_mode }}"
  notify:
    - Restart haproxy

- name: Create group
  ansible.builtin.group:
    name: haproxy
    system: true
    state: present

- name: Create user
  ansible.builtin.user:
    name: haproxy
    system: true
    state: present

- name: Configure software
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    validate: haproxy -c -f %s
    mode: "0640"
    backup: true
  notify:
    - Restart haproxy

- name: Modify selinux settings
  when:
    - ansible_facts['selinux']['status'] is defined
    - ansible_facts['selinux']['status'] == "enabled"
  block:
    - name: Add haproxy_stats_port to http_port_t selinux type
      community.general.seport:
        ports: "{{ haproxy_stats_port }}"
        proto: tcp
        setype: http_port_t
        state: present
      when:
        - haproxy_stats_port is defined

    - name: Allow haproxy to open any port
      ansible.posix.seboolean:
        name: haproxy_connect_any
        state: true
        persistent: true
      notify:
        - Reboot

# The handlers below restart HAProxy into whatever is on disk now, so the whole
# configuration is checked first with the installed binary, including the
# files that haproxy_config_check_args adds (a conf.d directory, for example).
# With SELinux enabled the check runs in HAProxy's own domain: the HAProxy
# Technologies packages compile regexes with PCRE2 JIT, which SELinux denies
# haproxy_t (no execmem). The same configuration passes `haproxy -c` as root
# and fails when the service starts.
- name: Check the HAProxy configuration
  ansible.builtin.command:
    argv: >-
      {{ (['runcon', 'system_u:system_r:haproxy_t:s0']
          if ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
          else [])
         + ['haproxy', '-c', '-f', '/etc/haproxy/haproxy.cfg']
         + haproxy_config_check_args }}
    # haproxy_t may not read the caller's working directory.
    chdir: /
  changed_when: false
  check_mode: false
  # In check mode haproxy_package may not be installed yet
  ignore_errors: "{{ ansible_check_mode }}"

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start and enable haproxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
