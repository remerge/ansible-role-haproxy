---
# tasks file for haproxy

- name: Import assert.yml
  ansible.builtin.import_tasks:
    file: assert.yml
  run_once: true
  delegate_to: localhost

- name: Add repository for HAProxy
  ansible.builtin.yum_repository:
    name: zenetys-latest
    description: "Packages by ZENETYS for Enterprise Linux $releasever - $basearch (latest)"
    baseurl: "https://packages.zenetys.com/latest/redhat/$releasever/RPMS/$basearch"
    gpgcheck: false
    exclude: "rsyslog8z"

- name: Uninstall legacy haproxy
  ansible.builtin.package:
    name: haproxy
    state: absent
  notify:
    - Restart haproxy

- name: Gather package facts
  ansible.builtin.package_facts:

# Zenetys ships every HAProxy branch and its +quic build as its own package.
# They install the same files and declare no conflict, so installing
# haproxy_package next to another build fails. dnf swap replaces the other
# build in one transaction.
- name: Replace other HAProxy builds
  vars:
    haproxy_other_builds: >-
      {{ ansible_facts.packages | select('match', '^haproxy[0-9]+z') |
         reject('equalto', haproxy_package) | list }}
  when: haproxy_other_builds | length > 0
  block:
    # The swap moves a changed /etc/sysconfig/haproxy aside as .rpmsave and
    # installs the default. haproxy.cfg is templated below; keep the rest.
    - name: Read the HAProxy service settings
      ansible.builtin.slurp:
        src: /etc/sysconfig/haproxy
      register: haproxy_sysconfig
      failed_when: false

    - name: Swap the other HAProxy builds for {{ haproxy_package }}
      ansible.builtin.command:
        cmd: dnf --assumeyes swap {{ item | quote }} {{ haproxy_package | quote }}
      loop: "{{ haproxy_other_builds }}"
      changed_when: true
      notify:
        - Restart haproxy

    - name: Restore the HAProxy service settings
      ansible.builtin.copy:
        content: "{{ haproxy_sysconfig.content | b64decode }}"
        dest: /etc/sysconfig/haproxy
        owner: root
        group: root
        mode: "0644"
      when: haproxy_sysconfig.content is defined

- name: Install haproxy
  ansible.builtin.package:
    name: "{{ haproxy_package }}"
    state: present
  notify:
    - Restart haproxy

- name: Create group
  ansible.builtin.group:
    name: haproxy
    system: true
    state: present

- name: Create user
  ansible.builtin.user:
    name: haproxy
    system: true
    state: present

- name: Configure software
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    validate: haproxy -c -f %s
    mode: "0640"
    backup: true
  notify:
    - Restart haproxy

- name: Modify selinux settings
  when:
    - ansible_facts['selinux']['status'] is defined
    - ansible_facts['selinux']['status'] == "enabled"
  block:
    - name: Add haproxy_stats_port to http_port_t selinux type
      community.general.seport:
        ports: "{{ haproxy_stats_port }}"
        proto: tcp
        setype: http_port_t
        state: present
      when:
        - haproxy_stats_port is defined

    - name: Allow haproxy to open any port
      ansible.posix.seboolean:
        name: haproxy_connect_any
        state: true
        persistent: true
      notify:
        - Reboot

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Start and enable haproxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
