[tool.poetry]
name = "ansible-role-haproxy"
version = "0.0.0"
description = "Ansible role for Haproxy"
authors = ["Remerge GmbH <core@remerge.io>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11, < 3.13"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.2.0"
flake8-bugbear = "^24.12.12"
pylint = "^3.3.7"
ansible-lint = { version = "^25.4.0", markers = "platform_system != 'Windows'" }
ansible-dev-tools = "^25.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
